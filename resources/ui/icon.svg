<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pixoo HID">
  <!-- The icon IS the layout: a 64-step LED grid, a left direction pad, a right action pad. -->
  <rect width="512" height="512" fill="#000"/>
  <defs>
    <pattern id="leds" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="7" fill="#161616"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#leds)"/>

  <!-- LEFT: origin-independent virtual stick -->
  <circle cx="160" cy="256" r="104" fill="none" stroke="#2bde6b" stroke-width="10"/>
  <circle cx="160" cy="256" r="34" fill="#2bde6b"/>

  <!-- RIGHT: one pad, two verbs (lower tap = main action, upper tap = the other one) -->
  <circle cx="352" cy="256" r="104" fill="none" stroke="#ff4d4d" stroke-width="10"/>
  <line x1="252" y1="256" x2="452" y2="256" stroke="#ff4d4d" stroke-width="8" stroke-dasharray="18 14"/>
  <circle cx="352" cy="176" r="20" fill="#7a2424"/>
  <circle cx="352" cy="336" r="20" fill="#ff4d4d"/>
</svg>
